<div class="step-title">Summary</div>

<div class="summary-section">
  <h4>Import Summary</h4>
  <table class="mapping-table">
    <thead>
      <tr>
        <th>Total Records</th>
        <th>Successful</th>
        <th>Failed</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>{{ total }}</td>
        <td style="color: green;">{{ successful }}</td>
        <td style="color: red;">{{ failed }}</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="failed-records-section" *ngIf="failed > 0">
  <h4>Failed Records Details</h4>
  <table class="mapping-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Error</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let rec of failedRecords">
        <td>{{ rec.firstName }}</td>
        <td>
          <!-- button instead of <a href> -->
          <button type="button"
                  class="error-link"
                  (click)="openErrors(rec)">
            Click to view {{ rec.errors.length }} errors
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal popup reusing your confirm-modal styles -->
<ng-container *ngIf="showModal">
  <div class="confirm-modal-overlay">
    <div class="confirm-modal">
      <h4>Error Details</h4>
      <ul>
        <li *ngFor="let e of modalErrors">{{ e }}</li>
      </ul>
      <div class="confirm-modal-actions">
        <button class="btn btn-secondary" (click)="closeModal()">Close</button>
      </div>
    </div>
  </div>
</ng-container>

<!-- Save Template Panel -->
<div class="save-template-panel">
  <h4>Save Template</h4>
  <label class="required" for="templateName">Template Name</label>
  <input
    type="text"
    id="templateName"
    [(ngModel)]="templateName"
    placeholder="Enter Template Name"
  />

  <label for="templatePermission">Template Access Permission</label>
  <select
    id="templatePermission"
    [(ngModel)]="permission"
    class="template-select"
  >
    <option value="public">Public</option>
    <option value="private">Private</option>
    <option value="restricted">Restricted</option>
  </select>

  <button (click)="onSaveTemplate()">Save Template</button>
</div>

<!-- Action Buttons -->
<div class="buttons horizontal">
  <button class="back-button" (click)="onRestart()">← Start Over</button>
  <button class="next-button" (click)="onFinish()">Finish</button>
  <button class="download-button" (click)="onDownload()">Download Results</button>
</div>
